# XcodeGen spec. Generate the Xcode project with:  cd ios && xcodegen
# (brew install xcodegen). The generated .xcodeproj is git-ignored; edit this file instead.
name: CilantroCheck
options:
  bundleIdPrefix: com.nkomoda
  deploymentTarget:
    iOS: "17.0"
targets:
  CilantroCheck:
    type: application
    platform: iOS
    sources:
      - path: CilantroCheck
        excludes:
          - "**/.gitkeep"
    info:
      path: CilantroCheck/Info.plist
      properties:
        CFBundleDisplayName: Cilantro?
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Take a photo of your food to check it for cilantro.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nkomoda.cilantrocheck
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: M655SXB4Q4  # your Personal Team (free Apple ID)
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon  # ios/CilantroCheck/Assets.xcassets/AppIcon.appiconset
